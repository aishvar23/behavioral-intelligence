name: Deploy Backend to Azure App Service

on:
  push:
    branches:
      - main          # → dev
      - staging       # → staging
      - production    # → prod
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

# Serialize deployments per branch — only one runs at a time, others queue.
# cancel-in-progress: false is intentional: cancelling a run kills the GitHub
# runner but NOT the in-flight Kudu upload, which leaves the deployment lock
# held and causes 409s for the next run. Queuing avoids all of this.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Pick the GitHub Environment based on branch
    # Each environment has its own scoped secrets
    environment: ${{ github.ref_name == 'main' && 'dev' || github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Compile TypeScript
        working-directory: backend
        run: npx tsc

      - name: Write version.json
        working-directory: backend
        run: |
          echo '{
            "sha": "${{ github.sha }}",
            "buildTime": "'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'",
            "version": "'"$(node -p "require('./package.json').version")"'"
          }' > version.json

      - name: Create deployment zip
        working-directory: backend
        run: zip -r ../deploy.zip dist/ src/ package.json package-lock.json tsconfig.json version.json

      - name: Disable Kudu build (we ship a pre-built zip)
        env:
          KUDU_USER: ${{ secrets.AZURE_KUDU_USER }}
          KUDU_PASS: ${{ secrets.AZURE_KUDU_PASS }}
          APP_HOSTNAME: ${{ secrets.AZURE_APP_HOSTNAME }}
        run: |
          curl -s -o /dev/null -X PUT \
            -u "$KUDU_USER:$KUDU_PASS" \
            -H "Content-Type: application/json" \
            -d '{"name":"SCM_DO_BUILD_DURING_DEPLOYMENT","value":"false","slotSetting":false}' \
            "https://$APP_HOSTNAME/api/settings"

      - name: Deploy to Azure App Service
        env:
          KUDU_USER: ${{ secrets.AZURE_KUDU_USER }}
          KUDU_PASS: ${{ secrets.AZURE_KUDU_PASS }}
          APP_HOSTNAME: ${{ secrets.AZURE_APP_HOSTNAME }}
        run: |
          # Upload zip — retry up to 5 times to handle 409 (lock held by prior deployment)
          for attempt in $(seq 1 5); do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              --max-time 120 \
              -u "$KUDU_USER:$KUDU_PASS" \
              -T deploy.zip \
              "https://$APP_HOSTNAME/api/zipdeploy?isAsync=true")
            echo "Upload attempt $attempt: HTTP $HTTP"
            if [ "$HTTP" = "202" ] || [ "$HTTP" = "200" ]; then break; fi
            if [ "$HTTP" = "409" ]; then
              echo "Kudu locked (409) — waiting 30s for prior deployment to finish..."
              sleep 30
            else
              echo "Unexpected HTTP $HTTP — aborting."
              exit 1
            fi
            if [ "$attempt" = "5" ]; then
              echo "Upload failed after 5 attempts."
              exit 1
            fi
          done

          # Poll until complete (max 10 min — Kudu can be slow on cold restarts)
          for i in $(seq 1 30); do
            sleep 20
            STATUS=$(curl -s --max-time 10 -u "$KUDU_USER:$KUDU_PASS" \
              "https://$APP_HOSTNAME/api/deployments/latest" | \
              python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status'))" 2>/dev/null)
            echo "[${i}] Deployment status: $STATUS"
            if [ "$STATUS" = "4" ]; then echo "Deployment succeeded."; exit 0; fi
            if [ "$STATUS" = "3" ]; then echo "Deployment failed."; exit 1; fi
          done
          echo "Deployment timed out after polling."
          exit 1
